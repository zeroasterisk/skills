target:
  name: "opencode-agent-harness"
  classification: "composite-user-agent"
  assessor: "security-and-governance-lead"
  description: "Open-source client-server AI coding harness (TUI, Desktop, Web, CLI) with local workspace tools (read, edit, write, shell), confined Code Mode runtime (execute), remote MCP integration, and public web tools (webfetch, websearch)."

scores:
  # 3.1 Protection (40%)
  safe_browsing_sandboxing: 4         # Read-only webfetch & confined Code Mode runtime; indirect prompt injection gated by tool permissions
  data_minimization_anti_tracking: 5  # Uniform User-Agent header ("OpenCode-User/1.0") with zero per-user tracking IDs or cross-site cookie leakage
  granular_informed_consent: 5        # Granular per-tool and per-pattern permissions (allow/ask/deny) in opencode.json plus Plan mode
  local_file_origin_isolation: 4      # Workspace boundary gating and explicit approval prompts before external/unapproved directory access

  # 3.2 Honesty (30%)
  action_consequence_visibility: 5    # Every tool call, shell command, and file diff is surfaced visibly in the UI before/during execution
  source_transformation_provenance: 5 # Fetched URLs, search queries, and MCP resource URIs are explicitly rendered in tool blocks
  active_truthfulness_indicators: 4   # Clear mode indicators (Plan vs Build), background subagent notifications, and MCP status
  honest_defaults_tradeoffs: 5        # Local-first architecture; user brings own model providers/keys without hidden ad targeting

  # 3.3 Loyalty (30%)
  user_primacy_over_third_parties: 5  # Open-source, user-controlled configuration; serves user instructions over model/site vendors
  scoped_reversible_commitments: 5    # Per-project worktrees, revocable MCP OAuth tokens, and isolated session state
  data_portability_zero_lock_in: 5    # Open JSON/JSONC configs, portable Agent Skills (SKILL.md), and multi-provider model switching
  contestability_user_override: 5     # Immediate cancellation, interactive question prompts, and read-only Plan mode

hard_gates:
  unsandboxed_external_execution: false
  covert_actions_or_deceptive_defaults: false
  divided_loyalty_third_party_primacy: false
  obstructs_data_portability: false
  unmarked_external_content_boundary: false

notes:
  component_boundary: "Clearly separates local filesystem tools from external web-interacting user agent tools (webfetch, websearch, execute fetch, remote MCPs) via explicit tool blocks."
  user_agent_header: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; OpenCode-User/1.0; +https://opencode.ai"
  portability_evidence: "Supports open SKILL.md and opencode.json standards; users can switch providers and export session transcripts freely."
