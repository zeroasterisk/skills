<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500;600&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:        #f8f9fa;   /* Google Grey 50 / M3 Surface */
      --color-paper-2:      #f1f3f4;   /* Google Grey 100 / Surface Container Low */
      --color-paper-3:      #e8eaed;   /* Google Grey 200 / Surface Container */
      --color-ink:          #1f1f1f;   /* Google Grey 900 / On-Surface */
      --color-muted:        #444746;   /* Google Grey 700 / On-Surface Variant */
      --color-soft:         #747775;   /* Google Grey 500 / Outline */
      --color-rule:         rgba(31,31,31,0.12);
      --color-rule-solid:   #c4c7c5;   /* Google Grey 300 */
      --color-accent:       #0b57d0;   /* Google Blue 700 / M3 Primary */
      --color-accent-tint:  rgba(11,87,208,0.08);
      --color-link:         #0b57d0;
      --font-sans:          'Google Sans Text', 'Google Sans', 'Roboto', system-ui, sans-serif;
      --font-title:         'Google Sans', 'Roboto', system-ui, sans-serif;
      --font-mono:          'Roboto Mono', 'Google Sans Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">[Type] · Material Design 3</p>
    <h1>[Diagram title]</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc">
      <title id="[diagram-slug]-title">[Diagram title]</title>
      <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444746"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b57d0"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b57d0"/></marker>
        <marker id="arrow-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e8e3e"/></marker>
        <marker id="arrow-error" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d93025"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8f9fa"/>

      <!-- Draw arrows first, then nodes with rx="12". Replace with your content. -->

    </svg>
  </div>
</body>
</html>
