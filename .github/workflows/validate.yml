name: Validate Plugins and Skills

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate:
    name: Spec Conformance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Test sync.py
        run: python3 -m unittest discover -s tests -v

      - name: Run validate-plugins.sh
        run: ./scripts/validate-plugins.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test strata-graph
        run: python3 -m unittest discover -s plugins/strata-graph/skills/strata-graph/tests -v

      - name: Lint strata-graph viewer (no-undef)
        run: >-
          npx --yes eslint@8.57.0 --no-eslintrc --env browser,es2022
          --parser-options ecmaVersion:2022 --rule '{"no-undef":"error"}'
          plugins/strata-graph/skills/strata-graph/assets/viewer.js

      - name: Test spec-gate hooks
        run: node --test plugins/spec-gate/test/*.test.mjs
